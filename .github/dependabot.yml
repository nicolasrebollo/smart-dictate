# Weekly pull requests for security and version updates: the pinned GitHub Actions (their commit pins
# are updated too) and the Python dependencies in uv.lock. Review and merge them like any change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The app's CPU onnxruntime stays on 1.23.x: the last version with Intel Mac wheels and macOS 13
      # support (pyproject.toml). Newer ones would break the Intel Mac app. The GPU build is separate.
      - dependency-name: onnxruntime
        versions: [">=1.24"]
