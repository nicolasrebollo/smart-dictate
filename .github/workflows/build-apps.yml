# Builds the Dictate desktop app for Windows and Mac (Apple silicon and Intel).
# Run it from the Actions tab ("Run workflow"): the files appear under the run's Artifacts.
# Push a tag like v0.2.0 and they're also attached to a GitHub Release.
#
# Security: it only runs on your own pushes of a v* tag or when you start it by hand (never for pull
# requests from forks), every job gets the least permission it needs, and every action is pinned to an
# exact commit (the comment names its version), so a moved tag can't change what runs here.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions: {}  # nothing by default; each job asks for what it needs

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: Dictate-Windows-Setup.exe
          - os: macos-latest  # Apple silicon; "latest" so a retired image (as macos-14 was) never breaks it
            file: Dictate-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            file: Dictate-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-system  # build with python.org's Python (PyInstaller-friendly)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the build never pushes: don't leave the token on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"  # also bundled into the Windows app (local mode's installer)
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install the app's dependencies (client + online mode) and PyInstaller
        run: uv sync --locked --no-dev --group build --extra cloud
      - name: Build
        run: uv run --no-sync python packaging/build.py --out "dist/${{ matrix.file }}"
      - name: Self-test the built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then app=build/dist/Dictate/Dictate.exe
          else app=build/dist/Dictate.app/Contents/MacOS/Dictate; fi
          status=0
          "$app" --self-test=selftest.json || status=$?
          cat selftest.json
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the Release and attach the files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (so people can check their download)
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: dist/*
