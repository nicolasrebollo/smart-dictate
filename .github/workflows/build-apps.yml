# Builds the Dictate desktop app for Windows and Mac (Apple silicon and Intel).
# Run it from the Actions tab ("Run workflow"): the files appear under the run's Artifacts.
# Push a tag like v0.2.0 and they're also attached to a GitHub Release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: Dictate-Windows-Setup.exe
          - os: macos-14
            file: Dictate-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            file: Dictate-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-system  # build with python.org's Python (PyInstaller-friendly)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install the client and PyInstaller
        run: uv sync --no-dev --group build
      - name: Build
        run: uv run --no-sync python packaging/build.py --out "dist/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
