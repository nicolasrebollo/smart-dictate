<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Dictate</title>
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dictate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#18181b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #fafafa; --fg: #18181b; --muted: #71717a; --card: #ffffff; --line: #e4e4e7;
    --accent: #18181b; --accent-fg: #fafafa; --rec: #dc2626; --ok: #16a34a; --warn: #d97706;
    --vh: 100dvh;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --card: #27272a; --line: #3f3f46;
            --accent: #f4f4f5; --accent-fg: #18181b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
               font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* --vh follows the visible area, so the mic stays above the keyboard */
  main { height: var(--vh); display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto;
         padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  body.kb main { padding-bottom: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.rec { background: var(--rec); }
  select { font: inherit; font-size: 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 8px; }
  #doc { flex: 1; min-height: 0; width: 100%; resize: none; background: var(--card); color: var(--fg);
         border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 17px;
         line-height: 1.5; outline: none; -webkit-appearance: none; }
  #doc:focus { border-color: var(--muted); }
  #doc::placeholder { color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; font: inherit; font-size: 15px; font-weight: 600; padding: 10px; border-radius: 12px;
                    cursor: pointer; color: var(--fg); background: var(--card); border: 1px solid var(--line); }
  .actions button:disabled { opacity: .4; cursor: default; }
  .talk-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; flex-direction: column; }
  .talk-row { display: flex; align-items: center; justify-content: center; gap: 18px; width: 100%; }
  #talk { width: 112px; height: 112px; border-radius: 50%; border: none; cursor: pointer; flex: none;
          background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
          touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
          transition: transform .12s ease, background .12s ease, width .15s ease, height .15s ease; }
  body.kb #talk { width: 64px; height: 64px; }
  body.kb #talk svg { width: 28px; height: 28px; }
  body.kb .talk-wrap { flex-direction: row; }
  #talk svg { width: 40px; height: 40px; }
  #talk.rec { background: var(--rec); color: #fff; transform: scale(1.06); }
  #talk.busy { opacity: .7; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; min-height: 1.45em; }
  body.kb .hint { text-align: left; flex: 1; }
  .hint button { font: inherit; color: var(--fg); font-weight: 600; background: none; border: none; padding: 0 4px;
                 text-decoration: underline; cursor: pointer; }
  #cancel { font: inherit; font-size: 14px; color: var(--muted); background: none; border: none; padding: 6px 10px;
            visibility: hidden; cursor: pointer; }
  #cancel.show { visibility: visible; }
  .setup { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .setup code { font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dictate</h1>
    <div style="display:flex; gap:10px; align-items:center">
      <span class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></span>
      <select id="lang" aria-label="Language">
        <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
      </select>
    </div>
  </header>

  <div class="setup" id="setup" hidden>
    <strong>One-time setup.</strong> Open the link that <code>dictate pc</code> prints on your PC
    (it ends with <code>?t=…</code>). Then use Share → <em>Add to Home Screen</em>.
    If this is a Home Screen app saved earlier, delete it and add it again from that link.
  </div>

  <textarea id="doc" spellcheck="true" autocapitalize="sentences"
            placeholder="Hold the mic and talk. Your words go wherever the cursor is, and you can type or edit here too."></textarea>
  <div class="actions">
    <button id="copy">Copy all</button>
    <button id="share">Share</button>
    <button id="clear">Clear</button>
  </div>

  <div class="talk-wrap">
    <div class="talk-row">
      <button id="talk" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">Hold to talk, or tap to start and tap to stop</div>
    <button id="cancel">Cancel</button>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// --- token ---------------------------------------------------------------------------------------
// Arrives in the URL (?t=..., or #t=... from older links) and is remembered in this browser.
// A Home Screen app has its own storage, separate from Safari's, so it gets the token from the
// manifest's start_url. iOS only reads the manifest the server put in the HTML, and the server
// only puts the token-carrying one there when the page was loaded as /?t=<token>. So always load
// the page that way.
const urlToken = new URLSearchParams(location.search).get("t");
const token = urlToken || new URLSearchParams(location.hash.slice(1)).get("t") || store.get("dictate-token") || "";
if (token) store.set("dictate-token", token);
if (token && urlToken !== token) location.replace("/?t=" + encodeURIComponent(token));
if (!token) $("setup").hidden = false;

const lang = $("lang");
lang.value = store.get("dictate-lang") || "en";
lang.onchange = () => store.set("dictate-lang", lang.value);
const hint = $("hint");
function say(text) { hint.textContent = text; }

// --- layout: keep the mic above the on-screen keyboard -------------------------------------------
const vv = window.visualViewport;
function fit() {
  if (!vv) return;
  document.documentElement.style.setProperty("--vh", vv.height + "px");
  document.body.classList.toggle("kb", window.innerHeight - vv.height > 120);
  window.scrollTo(0, 0);
}
if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit(); }

// --- the text: editable, kept between visits, voice goes in at the cursor -------------------------
const doc = $("doc");
doc.value = store.get("dictate-doc") || "";
let sel = { start: doc.value.length, end: doc.value.length };
let saveTimer = 0;
function remember() {
  sel = { start: doc.selectionStart, end: doc.selectionEnd };
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set("dictate-doc", doc.value), 250); }
doc.addEventListener("input", () => { remember(); save(); });
for (const ev of ["select", "keyup", "pointerup", "focus"]) doc.addEventListener(ev, remember);
document.addEventListener("selectionchange", () => { if (document.activeElement === doc) remember(); });

// Words that are lowercase mid-sentence ("I think | we should" -> "...think we should"); names never are.
const LOWER = new Set(("a an the and but or so then because if when while although though as since until unless " +
  "that which who what where why how this these those there here it its it's we you they he she him her them us me " +
  "my your our their his is are was were be been do does did have has had can could will would should may might " +
  "must not no yes also just even still maybe perhaps please thanks let let's for to of in on at with from by " +
  "about like into over after before more most some any all both each every other another such only really very " +
  "too again now today tomorrow yesterday soon later").split(" "));

function fitInto(text, before, after) {
  if (!text) return text;
  let t = text;
  const prev = before.replace(/[ \t]+$/, "").slice(-1);
  const startsBreak = /^\n/.test(t);
  // Continuing a sentence: lowercase a common first word ("…, and we" not "…, And we").
  if (prev && !startsBreak && !/[.!?…\n]/.test(prev)) {
    t = t.replace(/^([A-Z][a-z']*)(?=\b)/, (w) => (LOWER.has(w.toLowerCase()) && w !== "I" ? w.toLowerCase() : w));
  }
  // The text after the cursor continues the sentence: don't end ours with a period.
  if (/^[ \t]*[a-z,;:)]/.test(after) && /[^.]\.$/.test(t) && !/[.!?]\s/.test(t)) t = t.slice(0, -1);
  // Spacing on both sides.
  if (!startsBreak && before && !/[\s(\[{"“‘¿¡\/-]$/.test(before) && !/^[,.;:!?…)\]}]/.test(t)) t = " " + t;
  if (!/\s$/.test(t) && /^[^\s,.;:!?…)\]}]/.test(after)) t = t + " ";
  return t;
}

function insertText(text) {
  const v = doc.value;
  let start = Math.min(sel.start, v.length);
  const end = Math.min(Math.max(sel.end, start), v.length);
  if (/^\n/.test(text)) while (start > 0 && /[ \t]/.test(v[start - 1])) start--;  // no trailing space before a break
  const t = fitInto(text, v.slice(0, start), v.slice(end));
  if (!t) return;
  let done = false;
  if (document.activeElement === doc) {  // keeps the keyboard up and goes into the undo history
    doc.setSelectionRange(start, end);
    try { done = document.execCommand("insertText", false, t); } catch { done = false; }
  }
  if (!done) {
    doc.setRangeText(t, start, end, "end");
    if (document.activeElement !== doc) doc.scrollTop = end >= v.length ? doc.scrollHeight : doc.scrollTop;
  }
  sel = { start: start + t.length, end: start + t.length };
  save();
}

$("copy").onclick = () => copyText(doc.value).then((ok) => say(ok ? "Copied all text" : "Copy failed"));
$("share").onclick = () => { if (navigator.share && doc.value) navigator.share({ text: doc.value }).catch(() => {}); };
if (!navigator.share) $("share").hidden = true;
let cleared = null;
$("clear").onclick = () => {
  if (!doc.value) return;
  cleared = doc.value;
  doc.value = ""; sel = { start: 0, end: 0 }; save();
  hint.innerHTML = 'Cleared <button id="undo">Undo</button>';
  $("undo").onclick = () => { doc.value = cleared; sel = { start: cleared.length, end: cleared.length }; save(); say("Restored"); };
};
function copyText(t) {
  if (!t) return Promise.resolve(false);
  return navigator.clipboard ? navigator.clipboard.writeText(t).then(() => true, () => false) : Promise.resolve(false);
}

// --- connection: one WebSocket, checked before each dictation --------------------------------------
let ws = null, wsReady = null, lastRx = 0, retry = 500, pendingResult = null, pongWait = null;
function setStatus(text, cls) { $("status").textContent = text; $("dot").className = "dot " + (cls || ""); }
function connect() {
  if (!token) { setStatus("Not set up"); return Promise.reject(new Error("no token")); }
  if (ws && ws.readyState <= 1) return wsReady;
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?token=" + encodeURIComponent(token);
  const sock = new WebSocket(url);
  ws = sock;
  sock.binaryType = "arraybuffer";
  wsReady = new Promise((resolve, reject) => {
    const timer = setTimeout(() => { reject(new Error("timeout")); sock.close(); }, 6000);
    sock.onopen = () => { clearTimeout(timer); retry = 500; lastRx = Date.now(); if (!busyUi) setStatus("Ready", "on"); resolve(); };
    sock.onerror = () => { clearTimeout(timer); reject(new Error("connection failed")); };
  });
  wsReady.catch(() => {});
  sock.onmessage = (ev) => {
    lastRx = Date.now();
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "pong" && pongWait) { pongWait(); pongWait = null; }
    if ((m.type === "result" || m.type === "error") && pendingResult) { const r = pendingResult; pendingResult = null; r(m); }
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    if (!busyUi) setStatus("Offline: is the PC on?");
    if (pendingResult) { const r = pendingResult; pendingResult = null; r({ type: "error", message: "connection lost", lost: true }); }
    if (document.visibilityState === "visible") setTimeout(() => connect().catch(() => {}), retry = Math.min(retry * 2, 8000));
  };
  return wsReady;
}
// A socket can look open after the phone slept but be dead: ping it if it's been quiet.
async function live() {
  if (ws && ws.readyState === 1 && Date.now() - lastRx < 15000) return;
  if (ws && ws.readyState === 1) {
    const ok = await new Promise((resolve) => {
      pongWait = () => resolve(true);
      try { ws.send(JSON.stringify({ type: "ping" })); } catch { resolve(false); }
      setTimeout(() => resolve(false), 1500);
    });
    pongWait = null;
    if (ok) return;
    const dead = ws; ws = null; try { dead.close(); } catch {}
  }
  await connect();
}
setInterval(() => {  // keep the connection warm while the app is open
  if (document.visibilityState === "visible" && ws && ws.readyState === 1 && Date.now() - lastRx > 20000)
    live().catch(() => {});
}, 10000);

// --- microphone: 16 kHz mono PCM16 ---------------------------------------------------------------
const RATE = 16000, PREROLL = RATE * 0.3, CHUNK = 640; // 300 ms pre-roll, 40 ms packets
let audio = null, preroll = [], outbuf = [];
let rec = null;  // the dictation in progress: { chunks, sock, samples }
const workletSrc = `class Cap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0] && inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; } }
  registerProcessor("cap", Cap);`;

async function openMic() {
  if (audio) { if (audio.ctx.state !== "running") await audio.ctx.resume(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const url = URL.createObjectURL(new Blob([workletSrc], { type: "application/javascript" }));
  await ctx.audioWorklet.addModule(url);
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, "cap");
  const sink = ctx.createGain(); sink.gain.value = 0;
  src.connect(node); node.connect(sink); sink.connect(ctx.destination);
  const step = ctx.sampleRate / RATE; let pos = 0, acc = 0, n = 0;
  node.port.onmessage = (ev) => {  // box-filter resample to 16 kHz, convert to int16
    const x = ev.data, out = [];
    for (let i = 0; i < x.length; i++) {
      acc += x[i]; n++; pos += 1;
      if (pos >= step) { pos -= step; const v = Math.max(-1, Math.min(1, acc / n)); out.push(v < 0 ? v * 32768 : v * 32767); acc = 0; n = 0; }
    }
    if (rec && rec.recording) { outbuf.push(...out); pack(false); }
    else { preroll.push(...out); if (preroll.length > PREROLL) preroll.splice(0, preroll.length - PREROLL); }
  };
  audio = { ctx, stream };
}
function closeMic() {
  if (!audio) return;
  audio.stream.getTracks().forEach((t) => t.stop());
  audio.ctx.close(); audio = null; preroll = [];
}
// Every packet is kept for the whole dictation, so if the connection drops it can be sent again.
function pack(all) {
  while (outbuf.length >= CHUNK || (all && outbuf.length)) {
    const c = Int16Array.from(outbuf.splice(0, CHUNK)).buffer;
    rec.chunks.push(c); rec.samples += c.byteLength / 2;
    if (rec.sock && rec.sock === ws && ws.readyState === 1) ws.send(c);
  }
}
function beginOn(r) {  // tell the PC a dictation starts, and send what was recorded so far
  ws.send(JSON.stringify({ type: "start", language: lang.value }));
  for (const c of r.chunks) ws.send(c);
  r.sock = ws;
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { if (rec && rec.recording) cancel(); closeMic(); }  // release the mic
  else live().catch(() => {});
});

// --- talk button: hold to talk, or tap to toggle --------------------------------------------------
const talk = $("talk");
let downAt = 0, toggled = false, busyUi = false, pressing = false;

async function start() {
  if (busyUi || rec) return;
  if (!token) { say("Not set up: open the link your PC printed"); return; }
  try { await openMic(); } catch { say("Microphone blocked: allow it in Settings › Safari"); return; }
  const r = rec = { chunks: [], sock: null, samples: 0, recording: true };
  outbuf = preroll.splice(0); pack(false);
  talk.className = "rec"; $("cancel").classList.add("show"); setStatus("Listening", "rec"); say("Listening…");
  // Released before the mic was ready (e.g. during the permission prompt): switch to tap-to-stop.
  if (!pressing && !toggled) { toggled = true; say("Listening… tap to stop"); }
  live().then(() => { if (rec === r && r.recording && !r.sock) beginOn(r); }).catch(() => {
    if (rec === r && r.recording) setStatus("Reconnecting…", "rec");  // keep recording; sent on stop
  });
}

function waitResult(r, timeoutMs) {
  return new Promise((resolve) => {
    pendingResult = resolve;
    setTimeout(() => { if (pendingResult === resolve) { pendingResult = null; resolve({ type: "error", message: "no answer", lost: true }); } }, timeoutMs);
    try { ws.send(JSON.stringify({ type: "stop", raw: false })); } catch { pendingResult = null; resolve({ type: "error", lost: true }); }
  });
}

async function deliver(r) {
  const timeoutMs = 8000 + (r.samples / RATE) * 1000 * 0.5;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (!(r.sock && r.sock === ws && ws.readyState === 1)) { await live(); beginOn(r); }
    } catch { continue; }
    const m = await waitResult(r, timeoutMs);
    if (!m.lost) return m;
    if (ws === r.sock) { const dead = ws; ws = null; try { dead.close(); } catch {} }  // start over on a fresh connection
    r.sock = null;
  }
  return { type: "error", message: "Can't reach your PC. Your words weren't lost: check Tailscale and try again." };
}

function stop() {  // runs inside the tap/release gesture, so the clipboard write is allowed
  if (!rec || !rec.recording) return;
  const r = rec;
  busyUi = true; talk.className = "busy"; $("cancel").classList.remove("show");
  setStatus("Working…", "busy"); say("Cleaning up…");
  const result = new Promise((resolve) => {
    setTimeout(() => {  // keep 60 ms of tail so the last syllable isn't cut
      r.recording = false; pack(true);
      deliver(r).then(resolve);
    }, 60);
  });
  const inserted = result.then((m) => {
    if (m.type === "result" && m.text) insertText(m.text);
    return m;
  });
  // Copy the whole text as soon as it's ready (iOS only allows this from inside the tap).
  let copied = false, added = false;
  const report = () => { if (added) say(copied ? "Added and copied: paste it anywhere" : "Added"); };
  if (navigator.clipboard && window.ClipboardItem) {
    const blob = inserted.then((m) => {
      if (m.type !== "result" || !m.text || !doc.value) throw new Error("nothing");
      return new Blob([doc.value], { type: "text/plain" });
    });
    try {
      navigator.clipboard.write([new ClipboardItem({ "text/plain": blob })]).then(() => { copied = true; report(); }, () => {});
    } catch {}
  }
  inserted.then((m) => {
    busyUi = false; rec = null; stopUi();
    if (m.type !== "result") { say(m.message || "Something went wrong"); return; }
    if (!m.text) { say("Didn't catch anything"); return; }
    added = true; report();
  });
}

function cancel() {
  if (!rec || !rec.recording) return;
  const r = rec; rec = null; r.recording = false; outbuf = [];
  if (r.sock && r.sock === ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "cancel" }));
  stopUi(); say("Cancelled");
}
function stopUi() {
  talk.className = ""; toggled = false; $("cancel").classList.remove("show");
  const on = ws && ws.readyState === 1;
  setStatus(on ? "Ready" : "Offline: is the PC on?", on ? "on" : "");
}

talk.addEventListener("pointerdown", (e) => {
  e.preventDefault();  // keeps the cursor (and keyboard) in the text
  pressing = true;
  if (toggled) return;  // the second tap stops on release
  downAt = performance.now(); start();
});
talk.addEventListener("pointerup", (e) => {
  e.preventDefault();
  pressing = false;
  if (!rec || !rec.recording) return;
  if (!toggled && performance.now() - downAt < 350) { toggled = true; say("Listening… tap to stop"); return; }
  stop();
});
talk.addEventListener("pointercancel", () => { pressing = false; if (!toggled) cancel(); });
talk.addEventListener("contextmenu", (e) => e.preventDefault());
$("cancel").onclick = cancel;

connect().catch(() => {});
</script>
</body>
</html>
