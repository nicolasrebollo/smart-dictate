[project]
name = "dictate"
version = "0.1.0"
description = "Local, private push-to-talk dictation: speech -> clean text at your cursor. No cloud."
requires-python = ">=3.12"
dependencies = [
    "onnx-asr[gpu,hub]>=0.12",
    "onnxruntime-gpu[cuda,cudnn]>=1.27",
    "numpy>=2",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "pynput>=1.8",
    "platformdirs>=4",
    "pyside6-essentials>=6.8",
]

[project.scripts]
dictate = "dictate.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
# Only resolve package versions that ship wheels for this platform (some nvidia-* wheels are Linux-only).
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII (Spanish/French text in formatter + tests)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models (skipped automatically if they are not installed)"]

[tool.ruff.lint.per-file-ignores]
"src/dictate/cleanup/prompt.py" = ["E501"]  # prompt text reads better unwrapped
