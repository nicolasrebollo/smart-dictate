[project]
name = "dictate"
version = "0.2.1"
description = "Push-to-talk dictation with AI cleanup, on your own GPU, a PC that shares one, or an online AI service."
license = "MIT"
requires-python = ">=3.12"
# The client (Mac / PC): hotkey, microphone, paste. A few MB, no models.
dependencies = [
    "sounddevice>=0.5",
    "pynput>=1.8; sys_platform == 'win32'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "platformdirs>=4",
    "websockets>=15",
    "truststore>=0.10",  # check the PC's certificate like a browser (Mac Keychain / Windows store)
    "pystray>=0.19",
    "pillow>=11",
    "keyring>=25",  # API keys for online mode live in the system keychain, not the settings file
    "anthropic>=2.14",  # Claude, for the AI cleanup in online mode
]

[project.optional-dependencies]
# Online mode in the desktop app: speech detection runs locally (Silero on the CPU), the speech
# recognition and the AI cleanup run on the online service you choose.
cloud = [
    "numpy>=2",
    "rapidfuzz>=3",
    "onnxruntime>=1.23",
    "onnxruntime>=1.23,<1.24; sys_platform == 'darwin'",  # the last version with Intel Mac wheels (macOS 13+)
]
# The server (the PC with the GPU): speech recognition + AI cleanup.
server = [
    "numpy>=2",
    "onnx-asr[gpu,hub]>=0.12; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime-gpu[cuda,cudnn]>=1.32.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "soundfile>=0.13",
    "rapidfuzz>=3",
]

[project.scripts]
dictate = "dictate.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# Building the desktop app (packaging/build.py).
build = [
    "pyinstaller>=6.11",
]

[tool.uv]
# Both install the `onnxruntime` module (CPU build vs GPU build), so never together. The server's GPU
# build also runs online mode (it includes the CPU), so a server checkout needs only `--extra server`.
conflicts = [[{ extra = "cloud" }, { extra = "server" }]]
# Only resolve package versions that ship wheels for this platform (some nvidia-* wheels are Linux-only).
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII (Spanish/French text in formatter + tests)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models (skipped automatically if they are not installed)"]

[tool.ruff.lint.per-file-ignores]
"src/dictate/cleanup/prompt.py" = ["E501"]  # prompt text reads better unwrapped
"src/dictate/dialogs.py" = ["E501"]  # AppleScript has no line continuation we trust
